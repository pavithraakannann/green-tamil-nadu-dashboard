name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require deployed API URL
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL != '' && vars.VITE_API_BASE_URL != 'https://your-vercel-project.vercel.app' && vars.VITE_API_BASE_URL || 'https://green-tamil-nadu-dashboard.vercel.app' }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Configure the VITE_API_BASE_URL repository variable with the deployed Vercel API URL."
            exit 1
          fi
      - name: Build Vite site
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL != '' && vars.VITE_API_BASE_URL != 'https://your-vercel-project.vercel.app' && vars.VITE_API_BASE_URL || 'https://green-tamil-nadu-dashboard.vercel.app' }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url || steps.deploy-pages-retry.outputs.page_url || steps.deploy-pages-final.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy-pages
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before retry
        if: steps.deploy-pages.outcome == 'failure'
        run: sleep 10
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy-pages-retry
        if: steps.deploy-pages.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before final retry
        if: steps.deploy-pages.outcome == 'failure' && steps.deploy-pages-retry.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy-pages-final
        if: steps.deploy-pages.outcome == 'failure' && steps.deploy-pages-retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
